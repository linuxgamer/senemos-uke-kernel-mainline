%YAML 1.2
---
$id: http://devicetree.org/schemas/firmware/xiaomi,uke-ssc-sensors.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Xiaomi Uke firmware-owned SSC sensors

maintainers:
  - MCC45TR <75160848+MCC45TR@users.noreply.github.com>

description: |
  These sensors belong to the Qualcomm SSC firmware and are discovered by SUID.
  The native IIO consumer requires matching SSC datatype and API metadata before
  exposing measurements. The legacy compatible preserves the description map
  for diagnostics. Model candidates are registry evidence, not probed part
  numbers. Neither form instantiates direct I2C/SPI clients, selects calibration,
  or overrides SSC discovery. Unsupported vendor datatypes remain descriptions.

properties:
  compatible:
    oneOf:
      - const: xiaomi,uke-ssc-sensors
      - items:
          - const: xiaomi,uke-ssc-iio
          - const: xiaomi,uke-ssc-sensors
  remoteproc:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: ADSP remote processor that owns the sensor firmware.

patternProperties:
  '^(accelerometer|gyroscope|magnetometer|front-light|rear-light|color-temperature|proximity|flicker|sar|sensor-temperature)$':
    type: object
    properties:
      compatible:
        const: xiaomi,uke-ssc-sensor
      label: true
      qcom,ssc-datatype:
        $ref: /schemas/types.yaml#/definitions/string
        enum: [accel, gyro, mag, ambient_light, ambient_light_back, cct_front, proximity, flicker, sar, sensor_temperature]
        description: SSC datatype used by the native discovery client.
      xiaomi,model-candidates:
        $ref: /schemas/types.yaml#/definitions/string-array
        description: Alternative registry model names; no fitted identity claim.
    required: [compatible, label, 'qcom,ssc-datatype', 'xiaomi,model-candidates']
    additionalProperties: false

required: [compatible, remoteproc]
additionalProperties: false
