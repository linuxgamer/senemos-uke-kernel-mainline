# Raw touch and the memory-to-memory codec are not capture cameras.
monitor.v4l2.rules = [
  {
    matches = [
      {
        device.bus-path = "platform-a90000.spi-cs-0"
        device.product.name = "Uke NT36532 raw THP"
      }
    ]
    actions = {
      update-props = { device.disabled = true }
    }
  }
  {
    matches = [
      {
        device.bus-path = "platform-aa00000.video-codec"
        device.product.name = "qcom-iris-decoder"
      }
      {
        device.bus-path = "platform-aa00000.video-codec"
        device.product.name = "qcom-iris-encoder"
      }
    ]
    actions = {
      update-props = { device.disabled = true }
    }
  }
]
