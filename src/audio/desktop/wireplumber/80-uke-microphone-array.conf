{
  "monitor.alsa.rules": [
    {
      "matches": [
        {
          "node.name": "alsa_input.platform-sound-uke.HiFi__Mic__source"
        }
      ],
      "actions": {
        "update-props": {
          "audio.position": ["AUX0", "AUX1", "AUX2", "AUX3"],
          "api.alsa.use-chmap": false
        }
      }
    },
    {
      "matches": [
        {
          "node.name": "alsa_input.platform-sound-uke.HiFi__Mic__source",
          "alsa.card_name": "POCO-Pad-X1"
        }
      ],
      "actions": {
        "update-props": {
          "node.description": "POCO Pad X1 Mikrofon",
          "node.nick": "POCO Pad X1 Mikrofon"
        }
      }
    },
    {
      "matches": [
        {
          "node.name": "alsa_input.platform-sound-uke.HiFi__Mic__source",
          "alsa.long_card_name": "Xiaomi Pad 7"
        }
      ],
      "actions": {
        "update-props": {
          "node.description": "Xiaomi Pad 7 Mikrofon",
          "node.nick": "Xiaomi Pad 7 Mikrofon"
        }
      }
    }
  ]
}
