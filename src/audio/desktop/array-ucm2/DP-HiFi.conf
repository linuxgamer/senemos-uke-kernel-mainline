SectionVerb {
	# The single frontend needs its backend enabled before desktop PCM probing.
	EnableSequence [
		cset "name='DISPLAY_PORT_RX_0 Audio Mixer MultiMedia1' 1"
	]
	DisableSequence [
		cset "name='DISPLAY_PORT_RX_0 Audio Mixer MultiMedia1' 0"
	]
	Value {
		TQ "HiFi"
	}
}

SectionDevice."HDMI1" {
	Comment "DisplayPort monitor playback"
	Value {
		PlaybackPriority 200
		PlaybackChannels 2
		PlaybackPCM "hw:${CardId},0"
		JackControl "DP0 Jack"
	}
}
