Syntax 4

LibraryConfig.dpeld.File "/Qualcomm/@UKE_AUDIO_DRIVER@/DP-ELD.conf"
LibraryConfig.speakerctl.File "/Qualcomm/@UKE_AUDIO_DRIVER@/Speaker-ELD.conf"
LibraryConfig.speakers.File "/Qualcomm/@UKE_AUDIO_DRIVER@/Speaker-PCM.conf"
If.microphonecontrols {
	Condition {
		Type RegexMatch
		String "${CardComponents}"
		Regex "(^|[[:space:]])mic:uke-4ch-v4($|[[:space:]])"
	}
	True {
		LibraryConfig.microphones.File "/Qualcomm/@UKE_AUDIO_DRIVER@/Microphone-Controls.conf"
		SectionUseCase."HiFi" {
			File "/Qualcomm/@UKE_AUDIO_DRIVER@/Speaker-HiFi.conf"
			Comment "Internal microphones, speakers and DisplayPort"
		}
	}
	False.SectionUseCase."HiFi" {
		File "/Qualcomm/@UKE_AUDIO_DRIVER@/Speaker-HiFi.conf"
		Comment "Internal speakers and DisplayPort playback"
	}
}
