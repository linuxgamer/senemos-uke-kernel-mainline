# The Uke machine driver exposes DisplayPort ELD on frontend PCM 0.
ctl.!hw {
	@args [ CARD ]
	@args.CARD.type string
	type remap
	child {
		type hw
		card $CARD
	}
	remap {
		"iface=pcm,name='ELD',device=0" "iface=pcm,name='ELD',device=0"
		# Name-only UCM access also needs explicit identity entries.
		"iface=mixer,name='DISPLAY_PORT_RX_0 Audio Mixer MultiMedia1'" "iface=mixer,name='DISPLAY_PORT_RX_0 Audio Mixer MultiMedia1'"
		"iface=card,name='DP0 Jack'" "iface=card,name='DP0 Jack'"
	}
}
