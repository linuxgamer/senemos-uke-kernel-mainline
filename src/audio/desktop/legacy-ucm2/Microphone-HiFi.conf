# SPDX-License-Identifier: MIT
# One four-channel microphone array with stable physical channel identities.
SectionVerb {
	EnableSequence [
		cset "name='DISPLAY_PORT_RX_0 Audio Mixer MultiMedia1' 1"
		cset "name='SECONDARY_TDM_RX_0 Audio Mixer MultiMedia2' 1"
		cset "name='ADC1 MUX' CH1_AMIC1"
		cset "name='ADC3 MUX' CH3_AMIC3"
		cset "name='ADC4 MUX' CH4_AMIC4"
		cset "name='ADC2 MUX' CH2_AMIC5"
		cset "name='ADC1 Volume' 6"
		cset "name='ADC3 Volume' 6"
		cset "name='ADC4 Volume' 6"
		cset "name='ADC2 Volume' 6"
		cset "name='TX0 MODE' ADC_NORMAL"
		cset "name='TX2 MODE' ADC_NORMAL"
		cset "name='TX3 MODE' ADC_NORMAL"
		cset "name='TX1 MODE' ADC_NORMAL"
		cset "name='TX_DEC0 Volume' 96"
		cset "name='TX_DEC1 Volume' 96"
		cset "name='TX_DEC2 Volume' 96"
		cset "name='TX_DEC3 Volume' 96"
		cset "name='ADC1 Switch' 1"
		cset "name='ADC3 Switch' 1"
		cset "name='ADC4 Switch' 1"
		cset "name='ADC2 Switch' 1"
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX DEC1 MUX' SWR_MIC"
		cset "name='TX DEC2 MUX' SWR_MIC"
		cset "name='TX DEC3 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' SWR_MIC0"
		cset "name='TX SMIC MUX1' SWR_MIC2"
		cset "name='TX SMIC MUX2' SWR_MIC3"
		cset "name='TX SMIC MUX3' SWR_MIC1"
		cset "name='ADC1_MIXER Switch' 1"
		cset "name='ADC3_MIXER Switch' 1"
		cset "name='ADC4_MIXER Switch' 1"
		cset "name='ADC2_MIXER Switch' 1"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='TX_AIF1_CAP Mixer DEC1' 1"
		cset "name='TX_AIF1_CAP Mixer DEC2' 1"
		cset "name='TX_AIF1_CAP Mixer DEC3' 1"
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 1,0"
	]
	DisableSequence [
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 0,0"
		cset "name='TX_AIF1_CAP Mixer DEC3' 0"
		cset "name='TX_AIF1_CAP Mixer DEC2' 0"
		cset "name='TX_AIF1_CAP Mixer DEC1' 0"
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
		cset "name='ADC2_MIXER Switch' 0"
		cset "name='ADC4_MIXER Switch' 0"
		cset "name='ADC3_MIXER Switch' 0"
		cset "name='ADC1_MIXER Switch' 0"
		cset "name='ADC2 Switch' 0"
		cset "name='ADC4 Switch' 0"
		cset "name='ADC3 Switch' 0"
		cset "name='ADC1 Switch' 0"
		cset "name='TopLeft Speaker Switch' 0"
		cset "name='TopRight Speaker Switch' 0"
		cset "name='BottomLeft Speaker Switch' 0"
		cset "name='BottomRight Speaker Switch' 0"
		cset "name='SECONDARY_TDM_RX_0 Audio Mixer MultiMedia2' 0"
		cset "name='DISPLAY_PORT_RX_0 Audio Mixer MultiMedia1' 0"
	]
	Value { TQ "HiFi" }
}

SectionDevice."Mic" {
	Comment "Microphone array (4 channels)"
	EnableSequence []
	DisableSequence []
	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},2"
		CaptureChannels 4
		CaptureRate 48000
	}
}
