If.microphones {
	Condition {
		Type RegexMatch
		String "${CardComponents}"
		Regex "(^|[[:space:]])mic:uke-4ch-v3($|[[:space:]])"
	}
	True.Include.microphones.File "/Qualcomm/sm7675/Microphone-HiFi.conf"
	False {
SectionVerb {
	EnableSequence [
		cset "name='DISPLAY_PORT_RX_0 Audio Mixer MultiMedia1' 1"
		cset "name='SECONDARY_TDM_RX_0 Audio Mixer MultiMedia2' 1"
	]
	DisableSequence [
		cset "name='TopLeft Speaker Switch' 0"
		cset "name='TopRight Speaker Switch' 0"
		cset "name='BottomLeft Speaker Switch' 0"
		cset "name='BottomRight Speaker Switch' 0"
		cset "name='SECONDARY_TDM_RX_0 Audio Mixer MultiMedia2' 0"
		cset "name='DISPLAY_PORT_RX_0 Audio Mixer MultiMedia1' 0"
	]
	Value { TQ "HiFi" }
}
	}
}

SectionDevice."Speaker" {
	Comment "Internal speakers (4 channels)"
	EnableSequence [
		cset "name='TopLeft Speaker Switch' 1"
		cset "name='TopRight Speaker Switch' 1"
		cset "name='BottomLeft Speaker Switch' 1"
		cset "name='BottomRight Speaker Switch' 1"
	]
	DisableSequence [
		cset "name='TopLeft Speaker Switch' 0"
		cset "name='TopRight Speaker Switch' 0"
		cset "name='BottomLeft Speaker Switch' 0"
		cset "name='BottomRight Speaker Switch' 0"
	]
	Value {
		PlaybackPriority 100
		PlaybackChannels 4
		PlaybackPCM "uke_speakers:${CardId}"
	}
}

SectionDevice."HDMI1" {
	Comment "DisplayPort monitor playback"
	Value {
		PlaybackPriority 200
		PlaybackChannels 2
		PlaybackPCM "hw:${CardId},0"
		JackControl "DP0 Jack"
	}
}
