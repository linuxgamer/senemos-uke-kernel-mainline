Syntax 4

LibraryConfig.dpeld.File "/Qualcomm/sm7675/DP-ELD.conf"
LibraryConfig.speakerctl.File "/Qualcomm/sm7675/Speaker-ELD.conf"
LibraryConfig.speakers.File "/Qualcomm/sm7675/Speaker-PCM.conf"
If.microphonecontrols {
	Condition {
		Type RegexMatch
		String "${CardComponents}"
		Regex "(^|[[:space:]])mic:uke-4ch-v3($|[[:space:]])"
	}
	True {
		LibraryConfig.microphones.File "/Qualcomm/sm7675/Microphone-Controls.conf"
		SectionUseCase."HiFi" {
			File "/Qualcomm/sm7675/Speaker-HiFi.conf"
			Comment "Internal microphones, speakers and DisplayPort"
		}
	}
	False.SectionUseCase."HiFi" {
		File "/Qualcomm/sm7675/Speaker-HiFi.conf"
		Comment "Internal speakers and DisplayPort playback"
	}
}
