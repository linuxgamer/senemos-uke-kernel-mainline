# Frontend registration only. No DSP graph, mixer, endpoint or physical route.
SectionPCMCapabilities."Playback" {
    formats "S24_LE"
    rate_min "48000"
    rate_max "48000"
    channels_min "4"
    channels_max "4"
}
SectionPCMCapabilities."Capture" {
    formats "S16_LE"
    rate_min "48000"
    rate_max "48000"
    channels_min "4"
    channels_max "4"
}
SectionPCM."AudioReach Playback (disabled)" {
    index "0"
    id "0"
    dai."AudioReach Playback" { id "0" }
    pcm."playback" { capabilities "Playback" }
}
SectionPCM."AudioReach Capture (disabled)" {
    index "1"
    id "1"
    dai."AudioReach Capture" { id "1" }
    pcm."capture" { capabilities "Capture" }
}
