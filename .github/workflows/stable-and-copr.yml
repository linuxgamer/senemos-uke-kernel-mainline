name: Stable source and COPR tracking
on:
  push:
    branches: [main]
    paths:
      - 'patches/**'
      - 'configs/**'
      - 'manifests/**'
      - 'packaging/**'
      - 'src/**'
      - 'tests/**'
      - 'Makefile'
      - 'senemos.sh'
      - '.copr/**'
      - '.github/workflows/stable-and-copr.yml'
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * *'
permissions:
  contents: read
concurrency:
  group: kernel-stable-tracking
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install host source-verification tools
        run: sudo apt-get update && sudo apt-get install -y jq rpm gnupg xz-utils
      - name: Validate reviewed Uke inputs and standalone entry
        if: github.repository == 'MCC45TR/senemos-uke-kernel-mainline'
        run: make validate && ./senemos.sh --self-test && ./senemos.sh --build 7.2.9 --distro=fedora --dry-run
      - name: Validate Fedora 44 kernel source selection
        if: github.repository != 'MCC45TR/senemos-uke-kernel-mainline'
        run: |
          set -euo pipefail
          make validate
          grep -Fx 'Version: 7.2.11' packaging/senemos-uke-linux-kernel-mainline.spec
      - name: Request one validated mainline build
        if: github.repository == 'MCC45TR/senemos-uke-kernel-mainline' && github.event_name == 'push'
        env:
          COPR_BUILD_HOOK: ${{ secrets.COPR_KERNEL_BUILD_HOOK }}
        run: |
          set -Eeuo pipefail
          test -n "$COPR_BUILD_HOOK"
          # A lost POST response must be investigated, never retried blindly.
          curl -fsS -X POST "$COPR_BUILD_HOOK" >/dev/null
      - name: Track latest stable without generic fallback
        if: github.repository == 'MCC45TR/senemos-uke-kernel-mainline' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          COPR_BUILD_HOOK: ${{ secrets.COPR_KERNEL_BUILD_HOOK }}
        run: |
          set -Eeuo pipefail
          latest=$(curl -fsSL https://www.kernel.org/releases.json | jq -er .latest_stable.version)
          profile="manifests/linux-$latest.json"
          test -f "$profile" || { echo "::error::Linux $latest requires a reviewed Uke port; automatic generic fallback is disabled"; exit 1; }
          make_version=$(make -s --eval='print-version: ; @echo $(version)' print-version)
          test "$latest" = "$make_version"
          # Push webhooks handle source changes. Daily polling builds a reviewed
          # stable version only when no matching accepted or active build exists.
          builds=$(curl -fsSL 'https://copr.fedorainfracloud.org/api_3/build/list?ownername=mcc45tr&projectname=uke-linux-test&packagename=senemos-uke-linux-kernel-mainline&limit=20')
          if jq -e --arg v "$latest-" 'any(.items[]; (.state == "succeeded" or .state == "running" or .state == "pending" or .state == "starting" or .state == "importing" or .state == "waiting") and ((.source_package.version // "") | startswith($v)))' <<< "$builds" >/dev/null; then exit 0; fi
          test -n "$COPR_BUILD_HOOK"
          curl -fsS -X POST "$COPR_BUILD_HOOK" >/dev/null
